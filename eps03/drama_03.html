<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Drama Audio Bonar</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #f4f4f4; 
        }
        .story-container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            max-width: 400px; 
            margin-top: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .line { 
            margin-bottom: 10px; 
            color: #888; 
            transition: 0.3s; 
            font-size: 18px; 
        }
        /* Ini CSS buat ngatur warna teks yang lagi jalan */
        .active { 
            color: #d32f2f; 
            font-weight: bold; 
            font-size: 20px; 
        }
    </style>
</head>
<body>
    <h2>Drama Mertua vs Menantu</h2>
    
    <!-- Kontrol Pemutar Audio -->
    <audio id="audioPlayer" controls>
        <source src="drama_03_menantu.mp3" type="audio/mpeg">
        Browser lu gak support audio, kawan.
    </audio>

    <!-- Tempat teks cerita muncul -->
    <div class="story-container" id="storyBoard"></div>

    <script>
        // 1. Ini peta waktunya (JSON) yang sudah disempurnakan
        const storyData = [
  {
    "time": 0.0,
    "text": "Anjali chupchap rasoi mein kaam kar rahi thi jab uski saas ne tana mara."
  },
  {
    "time": 6.04,
    "text": "Bahu, tumhare maa-baap ne toh shadi mein ek gadi tak nahi di!"
  },
  {
    "time": 11.28,
    "text": "Anjali ne rone ki koshish roki, Maji, mere pita ji ek ordinary school teacher hain."
  },
  {
    "time": 18.6,
    "text": "Saas ne gusse se bartan patka aur boli, Toh humne apne bete ki shadi is bhikaran se kyun ki?"
  },
  {
    "time": 26.0,
    "text": "Tabhi darwaze par ek kadak awaaz aayi, Kyunki us bhikaran ne meri company ko bankrupt hone se bachaya tha!"
  },
  {
    "time": 34.88,
    "text": "Sab piche mude, wahan Vikram, Anjali ka pati, gusse mein khada tha."
  },
  {
    "time": 41.28,
    "text": "Vikram ne ek legal file table par zor se phek di."
  },
  {
    "time": 45.88,
    "text": "Maa, yeh papers dekho. Anjali ek ordinary teacher ki beti nahi hai."
  },
  {
    "time": 52.0,
    "text": "Wo us IT company ki secret investor hai jahan main as a CEO kaam karta hoon!"
  },
  {
    "time": 59.24,
    "text": "Saas ke hosh ud gaye, aur wo haklate hue boli, Kya... yeh sach hai bahu?"
  },
  {
    "time": 65.42,
    "text": "Anjali ne ek thandi muskaan di aur apna rasoi ka apron utar diya."
  },
  {
    "time": 71.76,
    "text": "Haan maji. Aur kal maine wo company puri tarah se kharid li hai."
  },
  {
    "time": 81.76,
    "text": "Ab aapka beta technically sirf mera ek employee hai."
  },
  {
    "time": 89.0,
    "text": "Kamre mein maut jaisa sannata cha gaya, sirf Anjali ki payal ki awaaz goonj rahi thi."
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        // 2. Tampilkan semua teks ke layar saat awal dibuka
        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index; // Kasih ID unik per baris
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        // 3. Logika memantau detik audio untuk nge-blok warna teks
        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;

            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                
                // Kalau timer lagu sudah melewati batas 'time' di JSON
                if (currentTime >= line.time) {
                    // Hapus warna merah dari semua teks dulu
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    // Nyalakan warna merah cuma di teks yang sedang dibaca
                    textElement.classList.add("active");
                }
            });
        });
    </script>
</body>
</html>
