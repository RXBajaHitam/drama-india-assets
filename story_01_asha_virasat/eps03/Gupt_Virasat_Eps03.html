    <h2>Gupt_Virasat_Eps03</h2>

    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u0938\u0940\u0924\u093e \u092e\u0947\u091c\u093c \u092a\u0930 \u0930\u0916\u0947 \u0938\u094b\u0928\u0947 \u0915\u0947 \u091b\u094b\u091f\u0947 \u0917\u0939\u0928\u094b\u0902 \u0915\u094b \u092c\u093e\u0930-\u092c\u093e\u0930 \u091b\u0942\u0915\u0930 \u0909\u0928\u094d\u0939\u0947\u0902 \u0906\u0902\u0915\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 5.16,
    "text": "\u0935\u0939 \u091c\u094b\u0930 \u0926\u0947\u0915\u0930 \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u092a\u0930\u0902\u092a\u0930\u093e \u0914\u0930 \u0926\u0930\u094d\u091c\u093e \u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u0940 \u0905\u0938\u0932\u0940 \u092a\u0942\u0901\u091c\u0940 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 11.7,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0927\u0940\u0930\u0947 \u0938\u0947 \u0909\u0924\u094d\u0924\u0930 \u0926\u0947\u0924\u0940 \u0939\u0948 \u0915\u093f \u0907\u091c\u094d\u091c\u0924 \u0924\u094b \u0915\u0930\u094d\u092e\u094b\u0902 \u0938\u0947 \u092c\u0928\u0924\u0940 \u0939\u0948, \u0917\u0939\u0928\u094b\u0902 \u0938\u0947 \u0928\u0939\u0940\u0902\u2014\u092a\u0930 \u0936\u092c\u094d\u0926 \u0939\u0935\u093e \u092e\u0947\u0902 \u0915\u092e \u0905\u0938\u0930 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 15.98,
    "text": "\u0930\u093e\u0924 \u0915\u0947 \u0916\u093e\u0928\u0947 \u092e\u0947\u0902 \u092a\u0941\u0930\u093e\u0928\u0940 \u0918\u091f\u0928\u093e\u090f\u0901 \u0928\u093f\u0915\u093e\u0932\u0940 \u091c\u093e \u0930\u0939\u0940 \u0939\u0948\u0902; \u0915\u0941\u091b \u092c\u093e\u0924\u0947\u0902 \u0905\u0928\u0915\u0939\u0947 \u091c\u0916\u094d\u092e \u0915\u094b \u091b\u0941\u0915\u0930 \u091a\u0932\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 20.02,
    "text": "\u0935\u093f\u0915\u094d\u0930\u092e \u091a\u0941\u092a\u091a\u093e\u092a \u092c\u0948\u0920\u0915\u0930 \u0926\u0947\u0916\u0924\u093e \u0939\u0948; \u0909\u0938\u0915\u0940 \u0906\u0901\u0916\u094b\u0902 \u092e\u0947\u0902 \u091a\u093f\u0902\u0924\u093e \u0914\u0930 \u091c\u093f\u091c\u094d\u091e\u093e\u0938\u093e \u0926\u094b\u0928\u094b\u0902 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 24.36,
    "text": "\u092e\u0940\u0930\u093e \u092c\u093e\u091c\u093e\u0930 \u092e\u0947\u0902 \u091a\u0932\u0940 \u091c\u093e \u0915\u0930 \u0915\u0941\u091b \u0938\u0941\u0928\u093e \u0914\u0930 \u0932\u094c\u091f\u0915\u0930 \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u0917\u093e\u0901\u0935 \u092e\u0947\u0902 \u0905\u092c \u0915\u0907\u092f\u094b\u0902 \u0915\u0940 \u0930\u0942\u091a\u093f \u092c\u0926\u0932 \u0917\u092f\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 28.48,
    "text": "\u0930\u092e\u0947\u0936 \u0915\u0939\u0924\u093e \u0939\u0948 \u0915\u093f \u0939\u092e\u0947\u0902 \u0938\u093e\u0935\u0927\u093e\u0928\u0940 \u0938\u0947 \u0915\u093e\u092e \u0932\u0947\u0928\u093e \u091a\u093e\u0939\u093f\u090f\u2014\u092a\u0930 \u0938\u0940\u0924\u093e \u0915\u093e \u0938\u094d\u0935\u0930 \u0905\u092a\u0947\u0915\u094d\u0937\u093e\u0913\u0902 \u0938\u0947 \u092d\u0930\u093e \u0939\u0948\u0964"
  },
  {
    "time": 30.96,
    "text": "\u0906\u0936\u093e \u0936\u093e\u0902\u0924 \u0939\u094b\u0915\u0930 \u0915\u091f\u094b\u0930\u0947 \u092e\u0947\u0902 \u0938\u0947\u0935\u093e \u0915\u0930\u0924\u0940 \u0939\u0948, \u092a\u0930 \u0909\u0938\u0915\u0947 \u0939\u093e\u0925\u094b\u0902 \u0915\u0940 \u0939\u0932\u094d\u0915\u0940 \u0925\u0930\u0925\u0930\u093e\u0939\u091f \u0915\u0941\u091b \u092c\u092f\u093e\u0901 \u0915\u0930 \u091c\u093e\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 34.5,
    "text": "\u0915\u093f\u0938\u0940 \u0928\u0947 \u091a\u0941\u092d\u0924\u0940 \u091f\u093f\u092a\u094d\u092a\u0923\u0940 \u0915\u0930 \u0926\u0940 \u0915\u093f \"\u0910\u0938\u0947 \u0930\u093f\u0936\u094d\u0924\u094b\u0902 \u092e\u0947\u0902 \u0938\u092e\u094d\u092e\u093e\u0928 \u092c\u0928\u093e\u092f\u0947 \u0930\u0916\u0928\u093e \u0915\u0920\u093f\u0928 \u0939\u0948\"\u2014\u0936\u092c\u094d\u0926 \u0939\u0935\u093e \u092e\u0947\u0902 \u091d\u0928\u0915\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u091a\u0947\u0939\u0930\u094b\u0902 \u092a\u0930 \u0905\u0938\u0930 \u091b\u094b\u0921\u093c\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 39.08,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u0915\u094b\u0936\u093f\u0936 \u0915\u0940 \u0915\u093f \u092c\u093e\u0924 \u0926\u093f\u0932 \u0938\u0947 \u0938\u092e\u091d\u093e\u0915\u0930 \u0938\u0941\u0932\u091d\u093e\u092f\u0947\u0902, \u092a\u0930 \u0938\u0940\u0924\u093e \u0928\u0947 \u0915\u0939\u093e \u0915\u093f \u0926\u093f\u0916\u093e\u0935\u0947 \u0938\u0947 \u0938\u092e\u093e\u091c \u092e\u0947\u0902 \u091c\u0917\u0939 \u092c\u0928\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 42.1,
    "text": "\u0906\u0936\u093e \u090f\u0915 \u092a\u0932 \u0915\u0947 \u0932\u093f\u090f \u0916\u0921\u093c\u0940 \u0939\u094b\u0924\u0940 \u0939\u0948, \u0906\u0901\u0916\u0947\u0902 \u091d\u0941\u0915\u0940 \u0939\u0941\u0908\u2014\u0909\u0938\u0928\u0947 \u090f\u0915 \u0935\u093e\u0926\u093e \u0915\u093f\u092f\u093e \u0939\u0948 \u091c\u093f\u0938\u0947 \u0935\u0939 \u0928\u093f\u092d\u093e\u0924\u0940 \u0906\u0908 \u0939\u0948\u0964"
  },
  {
    "time": 46.42,
    "text": "\u0930\u093e\u0924 \u0915\u0947 \u092c\u093e\u0926 \u090f\u0915 \u092e\u094b\u091f\u0930\u0938\u093e\u0907\u0915\u093f\u0932 \u0915\u0940 \u0924\u0947\u091c\u093c \u0906\u0935\u093e\u095b \u0906\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u0915\u093f\u0938\u0940 \u0915\u0947 \u0920\u0939\u0930\u0928\u0947 \u0938\u0947 \u0918\u0930 \u0915\u0940 \u0924\u093e\u091c\u093c\u0917\u0940 \u091f\u0942\u091f \u091c\u093e\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 50.2,
    "text": "\u0926\u0930\u0935\u093e\u091c\u093c\u093e \u0916\u0941\u0932\u0924\u093e \u0939\u0948 \u0914\u0930 \u092c\u093e\u0939\u0930 \u090f\u0915 \u092f\u0941\u0935\u0915 \u0916\u0921\u093c\u093e \u0939\u094b\u0924\u093e \u0939\u0948\u2014\u0909\u0938\u0915\u0947 \u0939\u093e\u0925 \u092e\u0947\u0902 \u090f\u0915 \u092b\u093c\u093e\u0907\u0932 \u0939\u0948 \u0914\u0930 \u091a\u0947\u0939\u0930\u093e \u091a\u093f\u0902\u0924\u093f\u0924\u0964"
  },
  {
    "time": 53.18,
    "text": "\u0935\u0939 \u092b\u093c\u093e\u0907\u0932 \u0916\u094b\u0932\u0924\u0947 \u0939\u0940 \u0915\u0941\u091b \u092a\u0941\u0930\u093e\u0928\u0947 \u092e\u0948\u0926\u093e\u0928 \u0915\u0947 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0926\u093f\u0916\u093e\u0924\u0947 \u0939\u0948\u0902\u2014\u0932\u094b\u0917 \u0939\u0948\u0930\u093e\u0928 \u0939\u094b \u0915\u0930 \u092c\u0948\u0920\u0947 \u0930\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 57.98,
    "text": "\u0915\u093f\u0938\u0940 \u0928\u0947 \u0915\u0939\u093e \u0915\u093f \u092f\u0939 \u0915\u093f\u0938\u0940 \u092a\u0941\u0930\u093e\u0928\u0940 \u0926\u0947\u0928\u0926\u093e\u0930\u0940 \u0915\u093e \u0938\u0902\u0926\u0930\u094d\u092d \u0939\u0948, \u092a\u0930 \u0915\u093f\u0938\u0940 \u0915\u093e \u0938\u094d\u0935\u0930 \u0918\u092c\u0930\u093e\u092f\u093e \u0939\u0941\u0906 \u0939\u0948\u0964"
  },
  {
    "time": 60.02,
    "text": "\u0906\u0936\u093e \u0928\u0947 \u0927\u0940\u0930\u0947 \u0938\u0947 \u0915\u0939\u093e \u0915\u093f \u0935\u0939 \u0915\u092d\u0940 \u092d\u0940 \u092a\u0948\u0938\u0947 \u0938\u0947 \u0930\u093f\u0936\u094d\u0924\u0947 \u0928\u0939\u0940\u0902 \u0924\u0930\u093e\u0936\u0940, \u092a\u0930 \u0909\u0938\u0915\u0940 \u0906\u0935\u093e\u091c\u093c \u092e\u0947\u0902 \u0926\u0930\u094d\u0926 \u0925\u093e\u0964"
  },
  {
    "time": 63.16,
    "text": "\u092a\u0930 \u091c\u0948\u0938\u0947 \u0939\u0940 \u092c\u093e\u0924 \u0914\u0930 \u0916\u0941\u0932\u0928\u0947 \u0935\u093e\u0932\u0940 \u0925\u0940, \u092c\u093e\u0939\u0930 \u0915\u0940 \u092c\u093f\u091c\u0932\u0940 \u0905\u091a\u093e\u0928\u0915 \u091a\u0932\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0915\u092e\u0930\u0947 \u092e\u0947\u0902 \u0938\u0928\u094d\u0928\u093e\u091f\u093e \u091b\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964"
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
