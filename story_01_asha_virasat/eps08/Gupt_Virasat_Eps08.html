    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u090f\u0915 \u0920\u0902\u0921\u0940 \u0930\u093e\u0924 \u092e\u0947\u0902 \u0906\u0936\u093e \u091a\u0941\u092a\u091a\u093e\u092a \u092c\u093e\u091c\u093e\u0930 \u0938\u0947 \u0930\u093e\u0936\u0928 \u0932\u0947\u0915\u0930 \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u0930\u0916 \u0926\u0947\u0924\u0940 \u0939\u0948\u2014\u0909\u0938\u0915\u093e \u091a\u0947\u0939\u0930\u093e \u0925\u0915\u093e \u092a\u0930 \u0936\u093e\u0902\u0924 \u0939\u0948\u0964"
  },
  {
    "time": 5.76,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u092a\u0942\u091b\u0924\u0940 \u0939\u0948 \u0915\u093f \u0935\u0939 \u0915\u094d\u092f\u094b\u0902 \u0938\u092c \u0915\u0941\u091b \u091b\u0941\u092a\u093e\u0915\u0930 \u0915\u0930 \u0930\u0939\u0940 \u0939\u0948; \u0906\u0936\u093e \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u0915\u092d\u0940-\u0915\u092d\u0940 \u0938\u0902\u0917\u0924\u093f \u092c\u0928\u093e\u090f \u0930\u0916\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091a\u0941\u092a \u0930\u0939\u0928\u093e \u092a\u0921\u093c\u0924\u093e \u0939\u0948\u0964"
  },
  {
    "time": 9.0,
    "text": "\u092e\u0940\u0930\u093e \u0915\u093f\u0938\u0940 \u0917\u0941\u092a\u094d\u0924 \u092e\u0941\u0932\u093e\u0915\u093c\u093e\u0924 \u0938\u0947 \u0932\u094c\u091f\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u0909\u0938\u0928\u0947 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u094b\u0902 \u0915\u0947 \u0915\u0941\u091b \u0914\u0930 \u0928\u093f\u0936\u093e\u0928 \u0926\u0947\u0916\u0947\u2014\u0935\u093f\u0926\u0947\u0936\u0940 \u0915\u0902\u092a\u0928\u0940 \u0915\u093e \u0928\u093e\u092e \u092c\u093e\u0930-\u092c\u093e\u0930 \u0926\u093f\u0916\u093e\u0908 \u0926\u0947\u0924\u093e \u0939\u0948\u0964"
  },
  {

    "text": "\u0935\u093f\u0915\u094d\u0930\u092e \u0928\u0947 \u0930\u093e\u0924 \u092d\u0930 \u092a\u0941\u0930\u093e\u0928\u0947 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 \u091a\u0947\u0915 \u0915\u093f\u092f\u0947 \u0914\u0930 \u092a\u093e\u092f\u093e \u0915\u093f \u0915\u0902\u092a\u0928\u0940 \u0915\u0947 \u0915\u0941\u091b \u092a\u0941\u0930\u093e\u0928\u0947 \u0938\u0902\u0926\u0930\u094d\u092d \u0909\u0938\u0940 \u0928\u093e\u092e \u0915\u0947 \u0938\u093e\u0925 \u091c\u0941\u0921\u093c\u0947 \u0939\u0941\u090f \u0925\u0947\u0964"
  },
  {

    "text": "\u0938\u0940\u0924\u093e \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u092c\u0926\u0932\u0924\u0940 \u0928\u091c\u0930 \u0906\u0924\u0940 \u0939\u0948\u2014\u0935\u0939 \u0909\u0928 \u0932\u094b\u0917\u094b\u0902 \u0915\u0947 \u0938\u0902\u092a\u0930\u094d\u0915 \u092c\u0922\u093c\u093e \u0930\u0939\u0940 \u0939\u0948 \u091c\u094b \u0905\u092c \u0905\u0935\u0938\u0930 \u0926\u0947\u0916\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 21.42,
    "text": "\u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u0947 \u0905\u0902\u0926\u0930 \u0905\u0932\u0917-\u0905\u0932\u0917 \u092a\u0915\u094d\u0937 \u092c\u0928 \u0930\u0939\u0947 \u0939\u0948\u0902\u2014\u0915\u094b\u0908 \u0906\u0936\u093e \u0915\u0947 \u0938\u093e\u0925 \u0939\u0948, \u0915\u094b\u0908 \u0905\u0935\u0938\u0930 \u0915\u0947 \u0938\u093e\u0925\u0964"
  },
  {
    "time": 25.34,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0914\u0930 \u0906\u0936\u093e \u0915\u0941\u091b \u0938\u093e\u0915\u094d\u0937\u094d\u092f \u0907\u0915\u091f\u094d\u0920\u093e \u0915\u0930\u0928\u0947 \u0915\u093e \u092b\u0948\u0938\u0932\u093e \u0915\u0930\u0924\u0947 \u0939\u0948\u0902; \u0935\u0947 \u091a\u0941\u092a\u091a\u093e\u092a \u090f\u0915 \u092f\u094b\u091c\u0928\u093e \u092c\u0928\u093e\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 29.6,
    "text": "\u0930\u093e\u0924 \u0915\u094b \u091c\u092c \u0935\u0947 \u092f\u094b\u091c\u0928\u093e \u092c\u0928\u093e \u0930\u0939\u0947 \u0925\u0947, \u0924\u094b \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u091c\u094b\u0930\u0926\u093e\u0930 \u0926\u0938\u094d\u0924\u0915 \u0939\u0941\u0908\u2014\u092c\u093e\u0939\u0930 \u090f\u0915 \u0905\u091c\u0928\u092c\u0940 \u092a\u093e\u092f\u093e \u0917\u092f\u093e \u091c\u093f\u0938\u0928\u0947 \u0915\u0939\u093e \u0915\u093f \u0935\u0939 \u090f\u0915 \u091c\u093e\u0902\u091a \u0905\u0927\u093f\u0915\u093e\u0930\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 37.8,
    "text": "\u0909\u0938\u0915\u0947 \u0939\u093e\u0925 \u092e\u0947\u0902 \u0915\u0941\u091b \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0925\u0947 \u092a\u0930 \u091a\u0947\u0939\u0930\u093e \u0905\u091c\u094d\u091e\u093e\u0924 \u0914\u0930 \u0938\u094d\u0935\u0930 \u0920\u0902\u0921\u093e \u0925\u093e\u2014\u0909\u0938\u0928\u0947 \u0915\u0939\u093e \u0915\u093f \"\u0939\u092e\u0947\u0902 \u0907\u0928\u0915\u0947 \u0938\u094d\u0930\u094b\u0924 \u0915\u0940 \u091c\u093e\u0901\u091a \u0915\u0930\u0928\u0940 \u0939\u0948\"\u0964"
  },
  {
    "time": 41.3,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u0939\u092e\u0947\u0936\u093e \u0915\u0940 \u0924\u0930\u0939 \u090a\u0901\u091a\u093e \u0938\u094d\u0935\u0930 \u0928\u093f\u0915\u093e\u0932\u093e \u0915\u093f \u0938\u0924\u094d\u092f \u0938\u093e\u092e\u0928\u0947 \u0906\u090f\u2014\u092a\u0930 \u0909\u0938\u0915\u0940 \u0906\u0935\u093e\u091c\u093c \u092a\u0930 \u0915\u093f\u0938\u0940 \u0928\u0947 \u0938\u0935\u093e\u0932 \u0915\u0930 \u0926\u093f\u092f\u093e\u0964"
  },
  {
    "time": 45.74,
    "text": "\u091c\u0948\u0938\u0947 \u0939\u0940 \u0935\u0947 \u0906\u0917\u0947 \u091a\u0930\u094d\u091a\u093e \u0915\u0930\u0928\u0947 \u0935\u093e\u0932\u0947 \u0925\u0947, \u0905\u091a\u093e\u0928\u0915 \u092c\u093f\u091c\u0932\u0940 \u091a\u0932\u0940 \u0917\u092f\u0940 \u0914\u0930 \u0918\u0930 \u0905\u0901\u0927\u0947\u0930\u0947 \u092e\u0947\u0902 \u0921\u0942\u092c \u0917\u092f\u093e\u2014\u0915\u093f\u0938\u0940 \u0928\u0947 \u092c\u093e\u0939\u0930 \u0938\u0947 \u091c\u094b\u0930 \u0938\u0947 \u0936\u094b\u0930 \u0915\u093f\u092f\u093e\u2014\"\u092f\u0939 \u0938\u092c \u0905\u092d\u0940 \u0916\u0924\u094d\u092e \u0928\u0939\u0940\u0902 \u0939\u0941\u0906!\""
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
