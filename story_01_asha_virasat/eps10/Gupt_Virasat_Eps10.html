    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u090f\u0915 \u092c\u0921\u093c\u0940 \u0938\u092d\u093e \u0906\u092f\u094b\u091c\u093f\u0924 \u0915\u0940 \u0917\u092f\u0940 \u0924\u093e\u0915\u093f \u0938\u092d\u0940 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0914\u0930 \u0924\u0925\u094d\u092f \u0938\u092c\u0915\u0947 \u0938\u093e\u092e\u0928\u0947 \u0930\u0916\u0947 \u091c\u093e \u0938\u0915\u0947\u0902\u0964"

  {

    "text": "\u0938\u0940\u0924\u093e \u0928\u0947 \u0917\u0930\u094d\u0935 \u0938\u0947 \u0938\u094b\u091a\u093e \u0915\u093f \u0905\u092c \u0909\u0938\u0915\u093e \u0928\u093f\u0930\u094d\u0923\u093e\u092f\u0915 \u092a\u0932 \u0906\u092f\u093e \u0939\u0948\u2014\u092a\u0930 \u0909\u0938\u0915\u0947 \u091a\u0947\u0939\u0930\u0947 \u092a\u0930 \u090f\u0915 \u0905\u091c\u0940\u092c \u0918\u092c\u0930\u093e\u0939\u091f \u092d\u0940 \u0925\u0940\u0964"
  },
  {
    "time": 11.48,
    "text": "\u0930\u092e\u0947\u0936 \u0928\u0947 \u092e\u0902\u091a \u092a\u0930 \u0930\u0916\u0947 \u0932\u093f\u092b\u093e\u092b\u093c\u0947 \u092e\u0947\u0902 \u0938\u0947 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0928\u093f\u0915\u093e\u0932\u0947 \u0914\u0930 \u091c\u092c \u0909\u0938\u0928\u0947 \u090f\u0915 \u0935\u0938\u0940\u092f\u0924 \u0909\u0920\u093e\u0908 \u0924\u094b \u0915\u0941\u091b \u0932\u094b\u0917 \u0924\u093e\u0932\u093f\u092f\u093e\u0901 \u092c\u091c\u093e\u0928\u0947 \u0932\u0917\u0947\u0964"
  },
  {
    "time": 16.08,
    "text": "\u0935\u0938\u0940\u092f\u0924 \u0916\u0941\u0932\u0924\u0947 \u0939\u0940 \u0938\u092d\u0940 \u0915\u0940 \u0928\u093f\u0917\u093e\u0939\u0947\u0902 \u0909\u0938 \u092a\u0928\u094d\u0928\u0947 \u092a\u0930 \u091f\u093f\u0915 \u0917\u092f\u0940\u0902\u2014\u092b\u093f\u0930 \u0930\u092e\u0947\u0936 \u0928\u0947 \u0927\u0940\u092e\u0947 \u0938\u094d\u0935\u0930 \u092e\u0947\u0902 \u092a\u0922\u093c\u093e:"
  },
  {
    "time": 24.9,
    "text": "\"\u092f\u0939 \u0938\u094d\u092a\u0937\u094d\u091f \u0930\u0942\u092a \u0938\u0947 \u092a\u094d\u0930\u092e\u093e\u0923\u093f\u0924 \u0915\u093f\u092f\u093e \u091c\u093e\u0924\u093e \u0939\u0948 \u0915\u093f \u0906\u0936\u093e (Asha) \u0907\u0938 \u0938\u0902\u092a\u0924\u094d\u0924\u093f \u0915\u0940 \u092e\u0941\u0916\u094d\u092f \u0935\u093e\u0930\u093f\u0938 \u0939\u0948\u0964\""
  },
  {
    "time": 29.32,
    "text": "\u0915\u092e\u0930\u0947 \u092e\u0947\u0902 \u0905\u091a\u093e\u0928\u0915 \u0938\u0928\u094d\u0928\u093e\u091f\u093e \u091b\u093e \u0917\u092f\u093e; \u0936\u092c\u094d\u0926\u094b\u0902 \u0915\u0940 \u0905\u0928\u0915\u0939\u0940 \u0917\u0942\u0901\u091c \u0939\u0930 \u091a\u0947\u0939\u0930\u0947 \u092a\u0930 \u0906 \u0917\u092f\u0940\u0964"

  {
    "time": 32.36,
    "text": "\u0938\u0940\u0924\u093e \u0915\u093e \u091a\u0947\u0939\u0930\u093e \u092a\u0932\u0915 \u091d\u092a\u0915\u0924\u0947 \u0939\u0940 \u092c\u0926\u0932 \u0917\u092f\u093e\u2014\u092a\u0939\u0932\u0947 \u0928\u093f\u0930\u094d\u0926\u094b\u0937\u0924\u093e \u0915\u093e \u092e\u0941\u0916\u094c\u091f\u093e, \u0905\u092c \u0932\u093e\u0932\u091a \u0914\u0930 \u0915\u0939\u0940\u0902 \u0936\u0930\u094d\u092e\u093f\u0902\u0926\u0917\u0940 \u0915\u093e \u0938\u0902\u0917\u092e\u0964"
  },
  {
    "time": 35.94,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0915\u0940 \u0906\u0901\u0916\u0947\u0902 \u091a\u092e\u0915 \u0909\u0920\u0940\u0902\u2014\u0916\u0941\u0936\u0940 \u0914\u0930 \u0909\u0932\u091d\u0928 \u092e\u093f\u0932\u0940 \u0939\u0941\u0908\u2014\u092a\u0930 \u0906\u0936\u093e \u0928\u0947 \u091a\u0941\u092a\u094d\u092a\u0940 \u0925\u093e\u092e\u0947 \u0930\u0916\u0940 \u0914\u0930 \u0909\u0938\u0915\u0940 \u0938\u093e\u0901\u0938\u094b\u0902 \u0915\u0940 \u0932\u092f \u092e\u0947\u0902 \u090f\u0915 \u0926\u0943\u0922\u093c\u0924\u093e \u0925\u0940\u0964"
  },
  {
    "time": 36.74,
    "text": "\u092d\u0940\u0921\u093c \u092e\u0947\u0902 \u0915\u0941\u091b \u0932\u094b\u0917 \u0916\u0941\u0936\u0940 \u0938\u0947 \u0939\u093e\u0925 \u091c\u094b\u0921\u093c\u0915\u0930 \u0906\u092f\u0947 \u0914\u0930 \u0915\u0941\u091b \u0932\u094b\u0917 \u0939\u0948\u0930\u093e\u0928 \u0930\u0939 \u0915\u0930 \u091a\u0941\u092a \u0939\u094b \u0917\u092f\u0947\u0964"
  },
  {
    "time": 39.96,
    "text": "\u0906\u0936\u093e \u0928\u0947 \u0927\u0940\u092e\u0947 \u0938\u094d\u0935\u0930 \u092e\u0947\u0902 \u0915\u0939\u093e \u0915\u093f \u0909\u0938\u0928\u0947 \u092f\u0939 \u0938\u092c \u0907\u0938\u0932\u093f\u090f \u091b\u093f\u092a\u093e\u092f\u093e \u0924\u093e\u0915\u093f \u0915\u094b\u0908 \u0909\u0938\u0947 \u0915\u0947\u0935\u0932 \u0927\u0928 \u0915\u0947 \u0932\u093f\u090f \u0928 \u0905\u092a\u0928\u093e\u092f\u0947\u2014\u0909\u0938\u0928\u0947 \u092a\u0932\u0915\u0947\u0902 \u0928\u0939\u0940\u0902 \u0909\u0920\u093e\u0908\u0902 \u092a\u0930 \u0936\u092c\u094d\u0926\u094b\u0902 \u092e\u0947\u0902 \u0938\u091a \u0925\u093e\u0964"
  },
  {
    "time": 42.42,
    "text": "\u0938\u0940\u0924\u093e \u0928\u0947 \u0905\u092a\u0928\u0940 \u091c\u0940\u0924 \u0915\u093e \u091c\u0936\u094d\u0928 \u092e\u0928\u093e\u0928\u0947 \u0915\u0940 \u0915\u094b\u0936\u093f\u0936 \u0915\u0940, \u092a\u0930 \u0909\u0938\u0915\u0947 \u0939\u094b\u0902\u0920 \u0915\u093e\u0902\u092a \u0930\u0939\u0947 \u0925\u0947; \u0917\u093e\u0902\u0935 \u0935\u093e\u0932\u0947 \u0905\u092c \u0909\u0938\u0947 \u0905\u0932\u0917 \u0928\u091c\u0930\u094b\u0902 \u0938\u0947 \u0926\u0947\u0916\u0928\u0947 \u0932\u0917\u0947 \u0925\u0947\u0964"
  },
  {
    "time": 46.42,
    "text": "\u092a\u0930 \u091c\u0948\u0938\u0947 \u0939\u0940 \u092e\u093e\u0939\u094c\u0932 \u0925\u094b\u0921\u093c\u093e \u0936\u093e\u0902\u0924 \u0939\u0941\u0906, \u092e\u0902\u091a \u0915\u0947 \u092a\u0940\u091b\u0947 \u090f\u0915 \u092c\u0921\u093c\u0940 \u0938\u094d\u0915\u094d\u0930\u0940\u0928 \u092a\u0930 \u0905\u091a\u093e\u0928\u0915 \u090f\u0915 \u0928\u092f\u093e \u0928\u093e\u092e \u091a\u092e\u0915 \u0909\u0920\u093e\u2014\u090f\u0915 \u0935\u093f\u0926\u0947\u0936\u0940 \u0915\u0902\u092a\u0928\u0940 \u0915\u093e \u0928\u093e\u092e \u091c\u093f\u0938 \u092a\u0930 \u0915\u093f\u0938\u0940 \u0928\u0947 \u0935\u093f\u0938\u094d\u0924\u093e\u0930 \u0938\u0947 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u092d\u0947\u091c\u093e \u0925\u093e\u0964"
  },
  {
    "time": 49.5,
    "text": "\u0938\u094d\u0915\u094d\u0930\u0940\u0928 \u092a\u0930 \u0928\u093e\u092e \u0926\u0947\u0916\u0924\u0947 \u0939\u0940 \u0915\u0941\u091b \u0932\u094b\u0917\u094b\u0902 \u0915\u0940 \u091a\u093e\u0932 \u092c\u0926\u0932 \u0917\u092f\u0940; \u0924\u092d\u0940 \u092c\u093e\u0939\u0930 \u0938\u0947 \u0924\u0947\u091c\u093c \u0930\u094b\u0936\u0928\u0940 \u0914\u0930 \u092a\u0941\u0932\u093f\u0938 \u091c\u0948\u0938\u0940 \u0917\u093e\u0921\u093c\u093f\u092f\u094b\u0902 \u0915\u0940 \u0906\u0935\u093e\u091c\u093c \u0906\u0908\u2014\u0932\u0947\u0915\u093f\u0928 \u0905\u091a\u093e\u0928\u0915 \u0939\u0949\u0932 \u0915\u0940 \u092c\u0924\u094d\u0924\u0940 \u090f\u0915 \u0938\u093e\u0925 \u0917\u0941\u0932 \u0939\u094b \u0917\u092f\u0940 \u0914\u0930 \u0915\u093f\u0938\u0940 \u0928\u0947 \u091c\u094b\u0930 \u0938\u0947 \u091a\u093f\u0932\u094d\u0932\u093e\u0915\u0930 \u0915\u0939\u093e\u2014\"\u092f\u0939 \u0928\u093e\u092e \u0939\u092e\u093e\u0930\u0940 \u0939\u0926\u094b\u0902 \u0938\u0947 \u092c\u093e\u0939\u0930 \u0939\u0948!\""
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
