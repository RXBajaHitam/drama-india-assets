    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0927\u0948\u0930\u094d\u092f \u0915\u0947 \u0905\u0902\u0924\u093f\u092e \u0938\u0930\u0939\u0926 \u092a\u0930 \u0916\u0921\u093c\u0940 \u0925\u0940 \u0914\u0930 \u0909\u0938\u0915\u093e \u091a\u0947\u0939\u0930\u093e \u092a\u0938\u0940\u0928\u0947 \u0938\u0947 \u0924\u0930 \u0925\u093e\u0964"
  },
  {
    "time": 5.5,
    "text": "\u0935\u0939 \u0905\u092c \u0938\u0939\u0928 \u0938\u0947 \u0906\u0917\u0947 \u092c\u0922\u093c\u0915\u0930 \u092e\u093e\u0901 \u0938\u0940\u0924\u093e \u0915\u093e \u0938\u093e\u092e\u0928\u093e \u0915\u0930\u0928\u0947 \u0906\u0908 \u0925\u0940\u0964"
  },
  {
    "time": 11.62,
    "text": "\u0932\u094b\u0917 \u0938\u092d\u093e \u092e\u0947\u0902 \u0907\u0915\u091f\u094d\u0920\u0947 \u0925\u0947; \u0909\u0928\u0915\u0947 \u091a\u0947\u0939\u0930\u094b\u0902 \u092a\u0930 \u0909\u092e\u094d\u092e\u0940\u0926 \u0914\u0930 \u0918\u092c\u0930\u093e\u0939\u091f \u0926\u094b\u0928\u094b\u0902 \u092e\u093f\u0932 \u0930\u0939\u0947 \u0925\u0947\u0964"
  },
  {
    "time": 17.76,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u0938\u093e\u0927\u0940 \u0939\u0941\u0908 \u0906\u0935\u093e\u091c\u093c \u092e\u0947\u0902 \u0915\u0939\u093e \u0915\u093f \u0915\u093f\u0938\u0940 \u0915\u093e \u0905\u092a\u092e\u093e\u0928 \u0915\u0930\u0915\u0947 \u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u0940 \u0907\u091c\u094d\u091c\u0924 \u0928\u0939\u0940\u0902 \u092c\u091a\u0924\u0940\u0964"
  },
  {
    "time": 25.16,
    "text": "\u0938\u0940\u0924\u093e \u0915\u0947 \u0939\u094b\u0902\u0920\u094b\u0902 \u092a\u0930 \u092a\u0939\u0932\u0947 \u0924\u094b \u0920\u0939\u093e\u0915\u093e \u0925\u093e, \u092b\u093f\u0930 \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u090f\u0915 \u0917\u0939\u0930\u0940 \u0916\u0940\u091c \u0909\u092d\u0930 \u0906\u0908\u0964"
  },
  {
    "time": 28.14,
    "text": "\u0938\u0940\u0924\u093e \u0928\u0947 \u0915\u0939\u093e \u0915\u093f \u0909\u0938\u0928\u0947 \u0939\u092e\u0947\u0936\u093e \u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u0947 \u0928\u093e\u092e \u0914\u0930 \u092e\u093e\u0928 \u0915\u0947 \u0932\u093f\u090f \u0938\u094b\u091a\u093e \u0939\u0948, \u092a\u0930 \u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u092a\u0942\u091b\u093e\u2014\u0915\u093f\u0938\u0915\u0947 \u0932\u093f\u090f \u092f\u0939 \u092e\u093e\u0928 \u0925\u093e?"
  },
  {
    "time": 32.24,
    "text": "\u0930\u092e\u0947\u0936 \u092c\u0940\u091a \u092e\u0947\u0902 \u0906\u0935\u093e\u091c\u093c \u0909\u0920\u093e\u0915\u0930 \u092c\u094b\u0932\u093e \u0915\u093f \u0905\u092c \u0905\u0927\u093f\u0915 \u091c\u0941\u092c\u093e\u0928\u0940 \u091c\u0902\u0917 \u0938\u0947 \u0915\u093e\u092e \u0928\u0939\u0940\u0902 \u091a\u0932\u0947\u0917\u093e, \u0924\u0925\u094d\u092f\u094b\u0902 \u0915\u093e \u0938\u093e\u092e\u0928\u093e \u0915\u0930\u094b\u0964"
  },
  {
    "time": 36.96,
    "text": "\u0935\u093f\u0915\u094d\u0930\u092e \u0928\u0947 \u090f\u0915 \u092a\u0941\u0930\u093e\u0928\u093e \u091f\u0947\u092a \u0928\u093f\u0915\u093e\u0932\u093e \u0914\u0930 \u0915\u0939\u093e \u0915\u093f \u0907\u0938\u092e\u0947\u0902 \u0915\u0941\u091b \u092c\u093e\u0924\u0947\u0902 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 \u0939\u0948\u0902 \u2014 \u091a\u0940\u091c\u0947\u0902 \u091c\u094b \u0905\u0924\u0940\u0924 \u0915\u0947 \u0938\u093e\u0925 \u091c\u0941\u0921\u093c\u0940 \u0925\u0940\u0902\u0964"
  },
  {
    "time": 41.24,
    "text": "\u0932\u094b\u0917 \u0938\u0928\u094d\u0928 \u0939\u094b \u0917\u092f\u0947 \u091c\u092c \u091f\u0947\u092a \u092a\u0930 \u0906\u0936\u093e \u0915\u0940 \u092c\u091a\u092a\u0928 \u0915\u0940 \u0906\u0935\u093e\u091c\u093c \u0914\u0930 \u090f\u0915 \u092a\u0941\u0930\u093e\u0928\u093e \u0928\u093e\u092e \u092c\u093e\u0930-\u092c\u093e\u0930 \u0938\u0941\u0928\u093e\u0908 \u0926\u093f\u092f\u093e\u0964"
  },
  {
    "time": 46.72,
    "text": "\u091f\u0947\u092a \u0928\u0947 \u090f\u0915 \u0935\u093f\u0926\u0947\u0936\u0940 \u092a\u0924\u0947 \u0915\u093e \u0938\u0902\u0915\u0947\u0924 \u0926\u093f\u092f\u093e \u0914\u0930 \u0915\u0941\u091b \u0932\u0947\u0928\u0926\u0947\u0928 \u0915\u0940 \u0924\u093e\u0930\u0940\u0916\u0947\u0902 \u2014 \u091c\u094b \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c\u094b\u0902 \u0938\u0947 \u092e\u0947\u0932 \u0916\u093e\u0924\u0940\u0902\u0964"
  },
  {
    "time": 49.54,
    "text": "\u0938\u0940\u0924\u093e \u0915\u093e \u091a\u0947\u0939\u0930\u093e \u0905\u091a\u093e\u0928\u0915 \u092a\u0940\u0932\u093e \u092a\u0921\u093c \u0917\u092f\u093e; \u0909\u0938\u0915\u0947 \u092d\u0940\u0924\u0930 \u0915\u093e \u0938\u0902\u0924\u0941\u0932\u0928 \u0921\u094b\u0932\u093e \u0914\u0930 \u0935\u0939 \u0917\u0942\u0901\u0917\u0940 \u0938\u0940 \u092c\u0948\u0920 \u0917\u092f\u0940\u0964"
  },
  {
    "time": 54.64,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u091f\u0947\u092a \u0915\u0947 \u0938\u0902\u0915\u0947\u0924 \u092a\u0930 \u0938\u0935\u093e\u0932 \u0915\u093f\u092f\u093e \u0915\u093f \u0915\u094d\u092f\u093e \u0907\u0938 \u0938\u092c\u0915\u093e \u092e\u0924\u0932\u092c \u092f\u0939 \u0939\u0948 \u0915\u093f \u0915\u094b\u0908 \u092c\u0921\u093c\u0940 \u0936\u0916\u094d\u0938\u093f\u092f\u0924 \u092c\u093e\u0939\u0930 \u0938\u0947 \u091c\u0942\u0921\u093c\u093e \u0939\u0941\u0906 \u0939\u0948\u0964"
  },
  {
    "time": 58.54,
    "text": "\u092e\u0940\u0930\u093e \u0928\u0947 \u0927\u0940\u0930\u0947 \u0938\u0947 \u0915\u0939\u093e \u0915\u093f \u0909\u0938\u0947 \u090f\u0915 \u0906\u0926\u092e\u0940 \u0928\u0947 \u0916\u094b\u0916\u0932\u0947 \u0936\u092c\u094d\u0926\u094b\u0902 \u092e\u0947\u0902 \u091a\u0947\u0924\u093e\u0935\u0928\u0940 \u0926\u0940 \u0925\u0940\u2014\"\u091c\u094b \u0938\u091a \u091c\u093e\u0928\u0924\u0947 \u0939\u0948\u0902, \u0909\u0928\u094d\u0939\u0947\u0902 \u091a\u0941\u092a \u0915\u0930 \u0926\u0947\u0928\u093e \u0939\u094b\u0917\u093e\"\u0964"
  },
  {
    "time": 64.28,
    "text": "\u092d\u0940\u0921\u093c \u092e\u0947\u0902 \u0915\u0941\u091b \u0932\u094b\u0917\u094b\u0902 \u0915\u0940 \u0906\u0901\u0916\u094b\u0902 \u092e\u0947\u0902 \u0921\u0930\u093e\u0928\u0947 \u0935\u093e\u0932\u093e \u0909\u0924\u094d\u0938\u093e\u0939 \u0925\u093e; \u0915\u0941\u091b \u0932\u094b\u0917 \u0938\u0916\u094d\u0924 \u0939\u094b \u0915\u0930 \u0916\u0921\u093c\u0947 \u0930\u0939\u0947\u0964"
  },
  {
    "time": 65.68,
    "text": "\u0930\u093e\u0924 \u0915\u0947 \u0905\u0901\u0927\u0947\u0930\u0947 \u092e\u0947\u0902 \u090f\u0915 \u092a\u0941\u0930\u093e\u0928\u0940 \u092e\u0947\u0932 \u0917\u093e\u0921\u093c\u0940 \u0915\u0940 \u0924\u0930\u0939 \u0915\u094b\u0908 \u0906\u0935\u093e\u091c\u093c \u0906\u0924\u0940 \u0939\u0948; \u092b\u093f\u0930 \u090f\u0915 \u0915\u093e\u0917\u091c\u093c \u0917\u093f\u0930\u0924\u093e \u0939\u0948\u2014\u0909\u0938 \u092a\u0930 \u090f\u0915 \u0928\u093e\u092e \u0932\u093f\u0916\u093e \u0939\u0948 \u091c\u093f\u0938\u0947 \u092a\u0922\u093c\u0924\u0947 \u0939\u0940 \u0938\u092d\u0940 \u0938\u0939\u092e \u091c\u093e\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 70.72,
    "text": "\u0915\u093e\u0917\u091c\u093c \u092a\u0930 \u0935\u0939\u0940 \u0928\u093e\u092e \u0925\u093e \u091c\u094b \u091f\u0947\u092a \u0914\u0930 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c\u094b\u0902 \u092e\u0947\u0902 \u092c\u093e\u0930-\u092c\u093e\u0930 \u0906\u092f\u093e \u0925\u093e\u2014\u0928\u093e\u092e \u091c\u094b \u0915\u093f\u0938\u0940 \u0905\u0902\u0924\u0930\u0930\u093e\u0937\u094d\u091f\u094d\u0930\u0940\u092f \u092e\u093e\u092e\u0932\u0947 \u0938\u0947 \u091c\u0941\u0921\u093c\u093e \u0925\u093e\u0964"
  },
  {
    "time": 74.0,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u0917\u0939\u0930\u0940 \u0938\u093e\u0901\u0938 \u0932\u0940 \u0914\u0930 \u0915\u0939\u093e \u0915\u093f \u0905\u092c \u0915\u0947\u0935\u0932 \u092a\u0930\u093f\u0935\u093e\u0930 \u0939\u0940 \u0928\u0939\u0940\u0902, \u0909\u0928\u0915\u0940 \u092a\u0939\u091a\u093e\u0928 \u092d\u0940 \u0926\u093e\u0902\u0935 \u092a\u0930 \u0939\u0948\u0964"
  },
  {
    "time": 76.78,
    "text": "\u0938\u0940\u0924\u093e \u0915\u0940 \u0906\u0901\u0916\u094b\u0902 \u092e\u0947\u0902 \u092a\u0939\u0932\u0940 \u092c\u093e\u0930 \u0932\u091c\u094d\u091c\u093e \u0914\u0930 \u0915\u0941\u091b \u091f\u0942\u091f\u0928\u0947 \u091c\u0948\u0938\u093e \u092e\u093f\u0936\u094d\u0930\u093f\u0924 \u092d\u093e\u0935 \u0926\u093f\u0916\u093e\u0964"
  },
  {
    "time": 82.16,
    "text": "\u092a\u0930 \u091c\u0948\u0938\u0947 \u0939\u0940 \u0915\u094b\u0908 \u0906\u0917\u0947 \u092c\u0922\u093c\u0915\u0930 \u0915\u093e\u0917\u091c\u093c \u0909\u0920\u093e \u0915\u0930 \u092a\u0922\u093c\u0928\u0947 \u0915\u094b \u0917\u092f\u093e, \u092c\u093e\u0939\u0930 \u0938\u0947 \u0905\u091a\u093e\u0928\u0915 \u0924\u0947\u091c\u093c \u0915\u0926\u092e\u094b\u0902 \u0915\u0940 \u0906\u0939\u091f \u0939\u0941\u0908 \u0914\u0930 \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u091c\u094b\u0930\u0926\u093e\u0930 \u0916\u091f\u0916\u091f\u093e\u0939\u091f \u0939\u0941\u0908\u2014\u0915\u093f\u0938\u0940 \u0928\u0947 \u091c\u094b\u0930 \u0938\u0947 \u0915\u0939\u093e\u2014"
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
