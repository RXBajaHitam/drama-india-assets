    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u0915\u093f\u0938\u0940 \u0928\u0947 \u0917\u093e\u0901\u0935 \u092e\u0947\u0902 \u0906\u0936\u093e \u0915\u0947 \u092c\u093e\u0930\u0947 \u092e\u0947\u0902 \u092a\u0941\u0930\u093e\u0928\u0940 \u092c\u093e\u0924\u094b\u0902 \u0915\u094b \u0939\u0935\u093e \u0926\u0947 \u0926\u0940 \u0914\u0930 \u0905\u092c \u0938\u092c\u0915\u0947 \u0936\u092c\u094d\u0926 \u092c\u0926\u0932 \u0930\u0939\u0947 \u0939\u0948\u0902\u0964"

  },
  {
    "time": 12.3,
    "text": "\u0938\u0940\u0924\u093e \u0914\u0930 \u092d\u0940 \u0915\u0920\u094b\u0930 \u0938\u094d\u0935\u0930 \u092e\u0947\u0902 \u092c\u094b\u0932\u0924\u0940 \u0939\u0948 \u0915\u093f \"\u0939\u092e\u093e\u0930\u0947 \u0918\u0930 \u0915\u0940 \u092e\u093e\u0928-\u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093e \u0939\u0940 \u0938\u092c \u0915\u0941\u091b \u0939\u0948\"\u0964"
  },
  {
    "time": 15.68,
    "text": "\u0930\u092e\u0947\u0936 \u091a\u0941\u092a\u091a\u093e\u092a \u092c\u0940\u091a \u092e\u0947\u0902 \u0906\u0915\u0930 \u0915\u0939\u0924\u093e \u0939\u0948 \u0915\u093f \u0906\u0930\u094b\u092a\u094b\u0902 \u0915\u094b \u0938\u091a \u092e\u093e\u0928\u0928\u0947 \u0938\u0947 \u092a\u0939\u0932\u0947 \u091c\u093e\u0901\u091a \u091c\u093c\u0930\u0942\u0930\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 22.6,
    "text": "\u092e\u0940\u0930\u093e \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u0905\u092b\u093c\u0935\u093e\u0939\u0947\u0902 \u0932\u094b\u0917\u094b\u0902 \u0915\u094b \u0924\u094b\u0921\u093c \u0926\u0947\u0924\u0940 \u0939\u0948\u0902, \u092a\u0930 \u0915\u093f\u0938\u0940 \u0915\u0947 \u0936\u092c\u094d\u0926\u094b\u0902 \u092e\u0947\u0902 \u0915\u091f\u0941\u0924\u093e \u091d\u0932\u0915\u0924\u0940 \u0939\u0948\u0964"

  {
    "time": 29.54,
    "text": "\u0915\u0941\u091b \u092a\u0921\u093c\u094b\u0938\u0940 \u0916\u0941\u0932\u0947 \u0924\u094c\u0930 \u092a\u0930 \u0926\u0942\u0930\u0940 \u092c\u0928\u093e \u0932\u0947\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u0915\u0941\u091b \u0932\u094b\u0917 \u092a\u0943\u0937\u094d\u0920\u092d\u0942\u092e\u093f \u092e\u0947\u0902 \u092e\u0941\u0938\u094d\u0915\u0941\u0930\u093e \u0915\u0930 \u0905\u092a\u0928\u093e \u092b\u093e\u092f\u0926\u093e \u0926\u0947\u0916\u0924\u0947 \u0939\u0948\u0902\u0964"

  {
    "time": 32.72,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0918\u0930 \u0932\u094c\u091f \u0915\u0930 \u0905\u0915\u0947\u0932\u0947 \u092c\u0948\u0920\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0938\u094b\u091a\u0924\u0940 \u0939\u0948 \u0915\u093f \u0930\u093f\u0936\u094d\u0924\u094b\u0902 \u0915\u094b \u092c\u0928\u093e\u090f \u0930\u0916\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u094d\u092f\u093e \u0915\u0930\u0928\u093e \u0939\u094b\u0917\u093e\u0964"
  },
  {
    "time": 36.84,
    "text": "\u0906\u0936\u093e \u091a\u0941\u092a\u091a\u093e\u092a \u092a\u093e\u0938 \u0915\u0947 \u0924\u093e\u0932\u093e\u092c \u0915\u0940 \u0913\u0930 \u091c\u093e\u0924\u0940 \u0939\u0948, \u092a\u093e\u0928\u0940 \u092e\u0947\u0902 \u0905\u092a\u0928\u093e \u091a\u0947\u0939\u0930\u093e \u0926\u0947\u0916\u0924\u0940 \u0939\u0948 \u0914\u0930 \u092a\u0941\u0930\u093e\u0928\u0940 \u0938\u094d\u092e\u0943\u0924\u093f\u092f\u094b\u0902 \u0915\u094b \u092e\u0939\u0938\u0942\u0938 \u0915\u0930\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 39.84,
    "text": "\u0935\u0939 \u092f\u093e\u0926 \u0915\u0930\u0924\u0940 \u0939\u0948 \u0915\u093f \u0915\u094d\u092f\u094b\u0902 \u0909\u0938\u0928\u0947 \u0905\u092a\u0928\u0940 \u0905\u0938\u0932 \u092a\u0939\u091a\u093e\u0928 \u091b\u0941\u092a\u093e \u0930\u0916\u0940\u2014\u0915\u094d\u092f\u094b\u0902\u0915\u093f \u0909\u0938\u0928\u0947 \u0926\u0947\u0916\u093e \u0925\u093e \u0915\u093f \u0927\u0928 \u0938\u0947 \u0930\u093f\u0936\u094d\u0924\u0947 \u092c\u0926\u0932 \u091c\u093e\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 45.14,
    "text": "\u0917\u093e\u0901\u0935 \u0915\u0940 \u0938\u092b\u093c\u0947\u0926 \u0926\u0940\u0935\u093e\u0930\u094b\u0902 \u092a\u0930 \u0905\u092c \u0915\u093e\u0932\u0940 \u092c\u093e\u0924\u0947\u0902 \u0932\u093f\u0916\u0940 \u091c\u093e\u0928\u0947 \u0932\u0917\u0924\u0940 \u0939\u0948\u0902 \u0914\u0930 \u0932\u094b\u0917 \u0909\u0928 \u0938\u0902\u0915\u0947\u0924\u094b\u0902 \u092a\u0930 \u092c\u093e\u0924\u0947\u0902 \u092c\u0928\u093e\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 47.38,
    "text": "\u0930\u093e\u0924 \u092e\u0947\u0902 \u0938\u0930\u092a\u0902\u091a \u0915\u0947 \u0918\u0930 \u092a\u0930 \u090f\u0915 \u092c\u0948\u0920\u0915 \u092c\u0941\u0932\u093e\u092f\u0940 \u091c\u093e\u0924\u0940 \u0939\u0948; \u0932\u094b\u0917\u094b\u0902 \u0915\u0940 \u0906\u0901\u0916\u094b\u0902 \u092e\u0947\u0902 \u0938\u0935\u093e\u0932 \u0914\u0930 \u092d\u0940\u0924\u0930\u0940 \u0921\u0930 \u0926\u094b\u0928\u094b\u0902 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 52.16,
    "text": "\u0938\u0940\u0924\u093e \u091c\u094b\u0930 \u0938\u0947 \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u0905\u0938\u0932\u0940 \u0938\u092e\u0938\u094d\u092f\u093e \u092f\u0939\u0940 \u0939\u0948\u2014\u0938\u092e\u094d\u092e\u093e\u0928 \u0915\u093e \u0905\u092d\u093e\u0935 \u0914\u0930 \u091b\u0935\u093f \u0915\u093e \u092a\u0924\u0928\u0964"
  },
  {
    "time": 55.5,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u0906\u0935\u093e\u091c\u093c \u0909\u0920\u093e\u0915\u0930 \u0915\u0939\u093e \u0915\u093f \u0932\u094b\u0917 \u0907\u0902\u0938\u093e\u0928 \u0939\u0948\u0902, \u0914\u0930 \u0907\u0902\u0938\u093e\u0928\u093f\u092f\u0924 \u0915\u094b \u092e\u0939\u0924\u094d\u0935 \u0926\u0947\u0928\u093e \u091a\u093e\u0939\u093f\u090f\u2014\u092a\u0930 \u0909\u0938\u0915\u0940 \u0906\u0935\u093e\u091c\u093c \u0926\u092c \u091c\u093e\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 57.78,
    "text": "\u092c\u093e\u0939\u0930 \u0905\u091a\u093e\u0928\u0915 \u0915\u094b\u0908 \u0924\u0947\u091c\u093c \u0906\u0935\u093e\u091c\u093c \u0915\u0930\u0924\u0940 \u0939\u0948 \u0915\u093f \"\u0938\u0924\u094d\u092f \u0915\u094b \u0938\u093e\u092c\u093f\u0924 \u0915\u0930\u094b \u092f\u093e \u0918\u0930 \u0915\u094b \u091b\u094b\u0921\u093c \u0926\u094b\"\u2014\u0932\u094b\u0917 \u091a\u094c\u0902\u0915\u0915\u0930 \u090f\u0915-\u0926\u0942\u0938\u0930\u0947 \u0915\u0940 \u0913\u0930 \u0926\u0947\u0916\u0924\u0947 \u0939\u0948\u0902\u0964"
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
