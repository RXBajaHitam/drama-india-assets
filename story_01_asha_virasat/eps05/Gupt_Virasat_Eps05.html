    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u0938\u0940\u0924\u093e \u092e\u093e\u0901\u0917\u0924\u0940 \u0939\u0948 \u0915\u093f \u0928\u0908 \u092c\u0939\u0942 \u0915\u0947 \u0918\u0930 \u0938\u0947 \u092e\u0939\u0902\u0917\u0947 \u0935\u0930\u0926\u093e\u0928 \u0914\u0930 \u0917\u0939\u0928\u0947 \u092e\u093f\u0932\u0928\u0947 \u091a\u093e\u0939\u093f\u090f\u2014\u092f\u0939 \u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u0940 \u092a\u094d\u0930\u0924\u093f\u0937\u094d\u0920\u093e \u092c\u0928\u093e\u090f\u0917\u093e\u0964"
  },
  {
    "time": 8.56,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0939\u093f\u091a\u0915\u0924\u0947 \u0939\u0941\u090f \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u092a\u094d\u092f\u093e\u0930 \u0914\u0930 \u0938\u092e\u094d\u092e\u093e\u0928 \u0915\u093e \u0905\u0930\u094d\u0925 \u0905\u0932\u0917 \u0939\u0948, \u0939\u092e \u0938\u092c \u0909\u0938\u0947 \u0938\u0940\u0916\u093e\u090f\u0901\u0917\u0947\u2014\u092a\u0930 \u0938\u0940\u0924\u093e \u0915\u093e \u0926\u092c\u093e\u0935 \u092c\u0922\u093c\u0924\u093e \u0939\u0948\u0964"
  },
  {
    "time": 13.02,
    "text": "\u0930\u092e\u0947\u0936 \u092c\u0940\u091a \u092e\u0947\u0902 \u0915\u0939\u0924\u093e \u0939\u0948 \u0915\u093f \u0939\u092e\u0947\u0902 \u0935\u094d\u092f\u093e\u0935\u0939\u093e\u0930\u093f\u0915 \u0939\u094b\u0928\u093e \u091a\u093e\u0939\u093f\u090f \u092a\u0930 \u0909\u0938\u0915\u0947 \u0936\u092c\u094d\u0926 \u0925\u092e\u0947 \u0939\u0941\u090f \u0932\u0917\u0924\u0947 \u0939\u0948\u0902\u0964"
  },
  {
    "time": 18.14,
    "text": "\u0906\u0936\u093e \u091a\u0941\u092a\u091a\u093e\u092a \u0930\u0938\u094b\u0908 \u092e\u0947\u0902 \u091c\u093e\u0924\u0940 \u0939\u0948 \u0914\u0930 \u092e\u0947\u091c\u093c \u0915\u0947 \u0928\u0940\u091a\u0947 \u090f\u0915 \u091b\u094b\u091f\u0947 \u0938\u0902\u0926\u0942\u0915 \u092e\u0947\u0902 \u0915\u0941\u091b \u0928\u094b\u091f \u0930\u0916 \u0926\u0947\u0924\u0940 \u0939\u0948\u2014\u092f\u0939 \u091b\u094b\u091f\u0940 \u092c\u091a\u0924 \u0939\u0948, \u092a\u0930 \u0909\u0938\u0915\u093e \u0905\u0930\u094d\u0925 \u0917\u0939\u0930\u093e \u0939\u0948\u0964"
  },
  {
    "time": 24.72,
    "text": "\u0935\u0939 \u091c\u093e\u0928\u0924\u0940 \u0939\u0948 \u0915\u093f \u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u0940 \u0936\u093e\u0902\u0924\u093f \u0915\u0947 \u0932\u093f\u090f \u0915\u092d\u0940-\u0915\u092d\u0940 \u092a\u093f\u0918\u0932\u0928\u093e \u092a\u0921\u093c\u0924\u093e \u0939\u0948, \u092a\u0930 \u0909\u0938\u0915\u0947 \u092d\u0940\u0924\u0930 \u0915\u0941\u091b \u091f\u0942\u091f\u0924\u093e \u092d\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 31.36,
    "text": "\u0938\u0940\u0924\u093e \u0905\u091a\u093e\u0928\u0915 \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \"\u092c\u0947\u091f\u0940, \u0924\u0941\u092e\u094d\u0939\u0947\u0902 \u0905\u092a\u0928\u0947 \u092c\u091a\u094d\u091a\u094b\u0902 \u0915\u0940 \u0938\u0902\u0917\u0924\u093f \u092a\u0930 \u0927\u094d\u092f\u093e\u0928 \u0930\u0916\u0928\u093e \u0939\u094b\u0917\u093e\u2014\u0909\u0928\u0915\u0940 \u0938\u0902\u0917\u0924\u093f \u0939\u092e\u093e\u0930\u0947 \u0938\u092e\u093e\u091c \u0915\u0947 \u0939\u093f\u0938\u093e\u092c \u0938\u0947 \u0939\u094b\u0928\u0940 \u091a\u093e\u0939\u093f\u090f\"\u0964"
  },
  {
    "time": 35.52,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0915\u094b \u092f\u0939 \u0906\u0926\u0947\u0936 \u0917\u0939\u0930\u093e \u091a\u0941\u092d\u0924\u093e \u0939\u0948; \u0935\u0939 \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \u092c\u091a\u094d\u091a\u094b\u0902 \u0915\u0940 \u0926\u094b\u0938\u094d\u0924\u0940 \u0909\u0928\u0915\u0940 \u092e\u093e\u0938\u0942\u092e\u093f\u092f\u0924 \u0939\u0948, \u0939\u092e\u0947\u0902 \u0909\u0938\u0947 \u092e\u093f\u091f\u093e\u0928\u093e \u0928\u0939\u0940\u0902 \u091a\u093e\u0939\u093f\u090f\u0964"
  },
  {
    "time": 40.48,
    "text": "\u0938\u0940\u0924\u093e \u0915\u093e \u0938\u094d\u0935\u0930 \u0938\u0916\u094d\u0924 \u0939\u094b \u091c\u093e\u0924\u093e \u0939\u0948\u2014\"\u0939\u092e \u091c\u0948\u0938\u0947 \u0939\u0948\u0902 \u0935\u0948\u0938\u0947 \u0939\u0940 \u0930\u0939\u0928\u093e \u091a\u093e\u0939\u093f\u090f, \u0928\u0939\u0940\u0902 \u0924\u094b \u0932\u094b\u0917 \u0915\u094d\u092f\u093e \u0938\u094b\u091a\u0947\u0902\u0917\u0947?\""
  },
  {
    "time": 44.02,
    "text": "\u0935\u093f\u0915\u094d\u0930\u092e \u092c\u093e\u0939\u0930 \u0938\u0947 \u0906\u092f\u093e \u0939\u0941\u0906 \u0915\u093e\u0917\u091c\u093c \u0926\u093f\u0916\u093e\u0924\u093e \u0939\u0948 \u091c\u093f\u0938\u092e\u0947\u0902 \u0932\u093f\u0916\u093e \u0925\u093e \u0915\u093f \u090f\u0915 \u0920\u0947\u0915\u0947\u0926\u093e\u0930 \u0928\u0947 \u0938\u0902\u092a\u0930\u094d\u0915 \u0930\u0926\u094d\u0926 \u0915\u0930 \u0926\u093f\u092f\u093e \u0939\u0948\u2014\u0915\u093f\u0938\u0940 \u0928\u0947 \u0935\u094d\u092f\u0935\u0938\u093e\u092f \u092e\u0947\u0902 \u0926\u0916\u093c\u0932 \u0926\u093f\u092f\u093e \u0939\u0948\u0964"
  },
  {
    "time": 46.72,
    "text": "\u092f\u0939 \u0916\u092c\u0930 \u0906\u0930\u094d\u0925\u093f\u0915 \u0926\u092c\u093e\u0935 \u092c\u0922\u093c\u093e\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0938\u0940\u0924\u093e \u0915\u093e \u0935\u094d\u092f\u0935\u0939\u093e\u0930 \u0914\u0930 \u0915\u0920\u094b\u0930 \u0939\u094b\u0924\u093e \u091c\u093e\u0924\u093e \u0939\u0948\u0964"
  },
  {
    "time": 50.32,
    "text": "\u0930\u093e\u0924 \u092e\u0947\u0902 \u0906\u0936\u093e \u092c\u093e\u0939\u0930 \u0915\u0947 \u0917\u0932\u0940 \u092e\u0947\u0902 \u0916\u0921\u093c\u0940 \u0939\u094b\u0915\u0930 \u091a\u0902\u0926\u093e \u0924\u093e\u0930\u0947 \u0926\u0947\u0916\u0924\u0940 \u0939\u0948\u2014\u0935\u0939 \u0938\u094b\u091a\u0924\u0940 \u0939\u0948 \u0915\u093f \u0915\u094d\u092f\u093e \u0909\u0938\u0915\u093e \u0924\u094d\u092f\u093e\u0917 \u0938\u093e\u0930\u094d\u0925\u0915 \u0939\u094b\u0917\u093e?"
  },
  {
    "time": 55.06,
    "text": "\u092a\u0930 \u0909\u0938\u0915\u0947 \u092e\u0928 \u092e\u0947\u0902 \u090f\u0915 \u0926\u0943\u0922\u093c \u0928\u093f\u0936\u094d\u091a\u092f \u0909\u092d\u0930\u0924\u093e \u0939\u0948\u2014\u0935\u0939 \u092a\u0930\u093f\u0935\u093e\u0930 \u0915\u094b \u092c\u091a\u093e\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u091a\u0941\u092a\u091a\u093e\u092a \u0906\u0917\u0947 \u092c\u0922\u093c\u0947\u0917\u0940\u0964"
  },
  {
    "time": 57.84,
    "text": "\u092c\u093e\u0939\u0930 \u0938\u0947 \u0905\u091a\u093e\u0928\u0915 \u0924\u0947\u091c\u093c \u0915\u093e\u0930 \u0915\u093e \u0939\u0949\u0930\u094d\u0928 \u0906\u0924\u093e \u0939\u0948 \u0914\u0930 \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u0924\u0947\u091c\u093c \u0920\u0939\u093e\u0915\u093e\u2014\u0915\u093f\u0938\u0940 \u0928\u0947 \u0928\u090f \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u092b\u0947\u0902\u0915\u0947 \u0939\u0948\u0902 \u0914\u0930 \u0915\u0939\u0940\u0902 \u0938\u0947 \u091a\u093f\u0932\u094d\u0932\u093e\u0939\u091f \u0906\u0924\u0940 \u0939\u0948\u2014\"\u092f\u0939 \u0938\u091a \u0939\u0948!\""
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
