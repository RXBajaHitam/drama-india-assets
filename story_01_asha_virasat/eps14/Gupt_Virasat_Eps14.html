    <script>
        const storyData = [
  {
    "time": 0.0,
    "text": "\u0928\u0915\u0932\u0940 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0914\u0930 \u0926\u0941\u0937\u094d\u092a\u094d\u0930\u091a\u093e\u0930 \u0928\u0947 \u0906\u0936\u093e \u0915\u0940 \u091b\u0935\u093f \u092a\u0930 \u0917\u0939\u0930\u093e \u0905\u0938\u0930 \u0921\u093e\u0932\u093e; \u0932\u094b\u0917 \u0905\u092c \u092a\u0941\u0930\u093e\u0928\u0947 \u0938\u0935\u093e\u0932\u094b\u0902 \u0915\u094b \u0926\u094b\u0939\u0930\u093e \u0930\u0939\u0947 \u0925\u0947\u0964"
  },
  {
    "time": 5.04,
    "text": "\u0938\u0940\u0924\u093e \u0928\u0947 \u092f\u0947 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0938\u093e\u0930\u094d\u0935\u091c\u0928\u093f\u0915 \u0915\u093f\u092f\u0947 \u0914\u0930 \u0915\u0939\u093e \u0915\u093f \u0907\u0928\u094d\u0939\u0947\u0902 \u0926\u0947\u0916\u0915\u0930 \u0939\u0930 \u0915\u094b\u0908 \u0938\u091a \u0938\u092e\u091d\u0947\u0917\u093e\u0964"
  },
  {
    "time": 8.4,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u0928\u0947 \u0906\u0939\u093f\u0938\u094d\u0924\u093e \u0938\u0947 \u0915\u0939\u093e \u0915\u093f \u091d\u0942\u0920 \u0915\u0940 \u091c\u0921\u093c \u0924\u0915 \u092a\u0939\u0941\u0901\u091a\u0928\u093e \u0939\u094b\u0917\u093e \u092a\u0930 \u0915\u093f\u0938\u0940 \u0928\u0947 \u092a\u0939\u0932\u0947 \u0939\u0940 \u0915\u0908 \u092c\u093e\u0930 \u0906\u0930\u094b\u092a \u0932\u0917\u093e \u0926\u093f\u090f \u0925\u0947\u0964"
  },
  {
    "time": 15.96,
    "text": "\u0935\u093f\u0915\u094d\u0930\u092e \u0917\u0941\u092a\u094d\u0924 \u0930\u0942\u092a \u0938\u0947 \u0909\u0928 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c\u094b\u0902 \u0915\u0940 \u092a\u0943\u0937\u094d\u0920\u092d\u0942\u092e\u093f \u092a\u0924\u093e \u0915\u0930\u0928\u0947 \u0932\u0917\u093e \u0914\u0930 \u092a\u093e\u092f\u093e \u0915\u093f \u0915\u0941\u091b \u0938\u093f\u0917\u094d\u0928\u0947\u091a\u0930 \u0914\u0930 \u092e\u094b\u0939\u0930\u094b\u0902 \u0915\u0940 \u092c\u0928\u093e\u0935\u091f \u0905\u0938\u093e\u092e\u093e\u0928\u094d\u092f \u0925\u0940\u0964"
  },
  {
    "time": 20.14,
    "text": "\u0930\u093e\u0924 \u092e\u0947\u0902 \u0906\u0936\u093e \u0915\u0947 \u0915\u092e\u0930\u0947 \u0915\u0947 \u092c\u093e\u0939\u0930 \u0915\u093e\u0932\u0940 \u0938\u094d\u092f\u093e\u0939\u0940 \u0938\u0947 \u0915\u0941\u091b \u0936\u092c\u094d\u0926 \u0932\u093f\u0916\u0947 \u0917\u092f\u0947 \u0925\u0947\u2014\u092f\u0939 \u0927\u092e\u0915\u0940 \u0925\u0940 \u091c\u094b \u0918\u0930 \u0915\u0947 \u0939\u0930 \u0938\u0926\u0938\u094d\u092f \u0915\u094b \u0939\u093f\u0932\u093e \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"
  },
  {
    "time": 24.22,
    "text": "\u0906\u0936\u093e \u0924\u093f\u091c\u094b\u0930\u0940 \u0916\u094b\u0932\u0928\u0947 \u0915\u0940 \u0915\u094b\u0936\u093f\u0936 \u0915\u0930\u0924\u0940 \u0939\u0948 \u0924\u093e\u0915\u093f \u0935\u0939 \u0915\u0941\u091b \u092a\u094d\u0930\u092e\u093e\u0923 \u0926\u093f\u0916\u093e \u0938\u0915\u0947, \u092a\u0930 \u091a\u093e\u092c\u0940 \u0917\u093e\u092f\u092c \u092e\u093f\u0932\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0909\u0938\u0915\u093e \u091a\u0947\u0939\u0930\u093e \u092a\u0940\u0932\u093e \u092a\u0921\u093c \u091c\u093e\u0924\u093e \u0939\u0948\u0964"
  },
  {
    "time": 28.64,
    "text": "\u0909\u0938 \u0938\u092e\u092f \u0905\u091a\u093e\u0928\u0915 \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u0924\u0947\u091c\u093c \u0926\u0938\u094d\u0924\u0915 \u0939\u094b\u0924\u0940 \u0939\u0948 \u0914\u0930 \u092c\u093e\u0939\u0930 \u0938\u0947 \u090f\u0915 \u0930\u094b\u092c\u0926\u093e\u0930 \u0906\u0935\u093e\u091c\u093c \u0915\u0939\u0924\u0940 \u0939\u0948 \u0915\u093f \"\u0924\u0941\u092e\u094d\u0939\u093e\u0930\u0947 \u092a\u093e\u0938 \u091c\u094b \u0915\u0941\u091b \u0939\u0948, \u0935\u0939 \u0926\u0942\u0938\u0930\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0916\u0924\u0930\u093e \u0939\u0948\"\u0964"
  },
  {
    "time": 33.82,
    "text": "\u092a\u094d\u0930\u093f\u092f\u093e \u092d\u093e\u0917 \u0915\u0930 \u092c\u093e\u0939\u0930 \u091c\u093e\u0924\u0940 \u0939\u0948 \u092a\u0930 \u0905\u0901\u0927\u0947\u0930\u0947 \u092e\u0947\u0902 \u0915\u093f\u0938\u0940 \u0928\u0947 \u0915\u0941\u091b \u092b\u0947\u0902\u0915 \u0926\u093f\u092f\u093e\u2014\u090f\u0915 \u0915\u093e\u0917\u091c\u093c \u091c\u093f\u0938\u092e\u0947\u0902 \u0915\u0947\u0935\u0932 \u090f\u0915 \u0936\u092c\u094d\u0926 \u0932\u093f\u0916\u093e \u0925\u093e: \"\u0930\u0941\u0915 \u091c\u093e\u0913\"\u0964"
  },
  {
    "time": 38.64,
    "text": "\u092d\u0940\u0921\u093c \u092e\u0947\u0902 \u092e\u093e\u0928\u094b \u090f\u0915 \u0930\u0902\u0917 \u0909\u0924\u0930 \u0906\u092f\u093e \u0914\u0930 \u0938\u092c \u0932\u094b\u0917 \u0906\u0936\u094d\u091a\u0930\u094d\u092f \u092e\u0947\u0902 \u0925\u0947\u2014\u092b\u093f\u0930 \u0915\u093f\u0938\u0940 \u0928\u0947 \u0915\u0939\u093e \u0915\u093f \u0928\u0915\u0932\u0940 \u0926\u0938\u094d\u0924\u093e\u0935\u0947\u091c\u093c \u0915\u0939\u0940\u0902 \u0914\u0930 \u0938\u0947 \u092d\u0947\u091c\u0947 \u0917\u092f\u0947 \u0939\u0948\u0902, \u0914\u0930 \u090f\u0915 \u092c\u0921\u093c\u0947 \u0916\u0947\u0932 \u0915\u0940 \u0936\u0941\u0930\u0941\u0906\u0924 \u0939\u0941\u0908 \u0939\u0948\u0964"
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
