<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एपिसोड 1: वापसी की रात</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; background: #121212; color: #ffffff; }
        h2 { color: #FF9933; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 22px; }
        audio { width: 100%; margin-bottom: 20px; outline: none; border-radius: 30px; }
        .story-container { margin-top: 10px; padding-bottom: 50px; }
        .line { margin-bottom: 15px; color: #777777; transition: 0.3s; font-size: 16px; line-height: 1.6; }
        .active { color: #FF9933; font-weight: bold; font-size: 19px; }
    </style>
</head>
<body>
    <h2>एपिसोड 1: वापसी की रात</h2>
    <audio id="audioPlayer" controls controlsList="nodownload">
        <source src="https://raw.githubusercontent.com/RXBajaHitam/drama-india-assets/main/story_02_Pratishodh_Ek_Chhal/eps01/eps01.mp3" type="audio/mpeg">
        Browser lu gak support audio, kawan.
    </audio>
    <div class="story-container" id="storyBoard"></div>
    <script>
        const storyData = [{"time": 0.0, "text": "शहर की सबसे ऊँची इमारत के टॉप फ्लोर पर खड़ा आर्यन सिंघानिया नीचे की टिमटिमाती रोशनी को देख रहा था। उसके हाथ में महँगी शराब का एक ग्लास था, लेकिन उसकी आँखों में एक ऐसी आग जल रही थी, जिसे दस साल की बारिश भी नहीं बुझा पाई थी।"}, {"time": 8.06, "text": "दस साल पहले, इसी शहर ने उसे मरने के लिए छोड़ दिया था। तब उसका नाम देव था। एक सीधा-साधा, भरोसेमंद देव, जिसने अपने ही सगे चाचा राजनाथ और अपने सबसे अच्छे दोस्त विक्रम पर आँख मूँद कर विश्वास किया था। और बदले में उसे क्या मिला? सिर्फ धोखा। उसकी पूरी संपत्ति छीन ली गई, और उसे एक जलते हुए गोदाम में धकेल दिया गया।"}, {"time": 11.76, "text": "सबको लगा देव उस आग में जलकर खाक हो गया। लेकिन उस राख से जो पैदा हुआ, वो आर्यन सिंघानिया था। एक नया चेहरा, एक नई पहचान, और एक ऐसा व्यापारिक साम्राज्य जिसे हिलाने की हिम्मत आज किसी में नहीं थी। उसके चेहरे पर प्लास्टिक सर्जरी के कारण कोई भाव नहीं था, सिर्फ एक खतरनाक शांति थी।"}, {"time": 15.52, "text": "कल रात, उसके चाचा राजनाथ ने अपने नए फाइव-स्टार होटल का उद्घाटन रखा है। वही होटल, जो देव के पिता के खून-पसीने की कमाई से बना था।"}, {"time": 19.7, "text": "आर्यन ने अपनी महंगी घड़ी की तरफ देखा। \"वक्त आ गया है,\" उसने खुद से फुसफुसाते हुए कहा। उसकी आवाज़ में एक अजीब सी ठंडक थी, जो किसी की भी रूह कंपा दे।"}, {"time": 25.72, "text": "उसने अपना ग्लास टेबल पर रखा और मुड़कर अपने सेक्रेटरी की तरफ देखा। \"गाड़ी तैयार करो। कल हम एक बहुत पुरानी उधारी चुकाने जा रहे हैं।\""}, {"time": 27.72, "text": "यह सिर्फ एक वापसी नहीं थी, यह एक भयानक तूफान की शुरुआत थी। और राजनाथ को इस बात का कोई अंदाजा नहीं था कि मौत उसके दरवाजे पर दस्तक देने वाली है।"}];
        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index;
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;
            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                if (currentTime >= line.time) {
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    textElement.classList.add("active");
                }
            });
        });
    </script>
</body>
</html>
