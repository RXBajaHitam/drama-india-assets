<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Drama Audio Bonar</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #f4f4f4; 
        }
        .story-container { 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            max-width: 400px; 
            margin-top: 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .line { 
            margin-bottom: 10px; 
            color: #888; 
            transition: 0.3s; 
            font-size: 18px; 
        }
        /* Ini CSS buat ngatur warna teks yang lagi jalan */
        .active { 
            color: #d32f2f; 
            font-weight: bold; 
            font-size: 20px; 
        }
    </style>
</head>
<body>
    <h2>Drama Mertua vs Menantu</h2>
    
    <!-- Kontrol Pemutar Audio -->
    <audio id="audioPlayer" controls>
        <source src="drama_02_balasdendam.mp3" type="audio/mpeg">
        Browser lu gak support audio, kawan.
    </audio>

    <!-- Tempat teks cerita muncul -->
    <div class="story-container" id="storyBoard"></div>

    <script>
        // 1. Ini peta waktunya (JSON) yang sudah disempurnakan
        const storyData = [
  {
    "time": 0.0,
    "text": "Priya, tumne meri sone ki chudi kahan chupayi?"
  },
  {
    "time": 4.42,
    "text": "Saas ne gusse se chilla kar kaha."
  },
  {
    "time": 7.56,
    "text": "Priya rone lagi, Maji, maine nahi li."
  },
  {
    "time": 11.96,
    "text": "Tabhi, piche se uske pati Rahul ne entry li."
  },
  {
    "time": 16.38,
    "text": "Maa, wo chudi maine bech di apni EMI bharne ke liye!"
  },
  {
    "time": 21.72,
    "text": "Saas shock, Priya shocked."
  }
];

        const storyBoard = document.getElementById("storyBoard");
        const audio = document.getElementById("audioPlayer");

        // 2. Tampilkan semua teks ke layar saat awal dibuka
        storyData.forEach((line, index) => {
            const p = document.createElement("p");
            p.className = "line";
            p.id = "line-" + index; // Kasih ID unik per baris
            p.innerText = line.text;
            storyBoard.appendChild(p);
        });

        // 3. Logika memantau detik audio untuk nge-blok warna teks
        audio.addEventListener("timeupdate", () => {
            let currentTime = audio.currentTime;

            storyData.forEach((line, index) => {
                const textElement = document.getElementById("line-" + index);
                
                // Kalau timer lagu sudah melewati batas 'time' di JSON
                if (currentTime >= line.time) {
                    // Hapus warna merah dari semua teks dulu
                    document.querySelectorAll(".line").forEach(el => el.classList.remove("active"));
                    // Nyalakan warna merah cuma di teks yang sedang dibaca
                    textElement.classList.add("active");
                }
            });
        });
    </script>
</body>
</html>
